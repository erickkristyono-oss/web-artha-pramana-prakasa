<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — PT Artha Pramana Prakasa</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" src="/assets/js/pages/login.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="auth">
    <aside class="auth__aside">
      <span class="eyebrow">Client Area</span>
      <h1>
        <span class="stair">Akses</span>
        <span class="stair">Layanan</span>
        <span class="stair stair--indent accent">Kami</span>
      </h1>
      <ul><li>Pilih paket layanan keuangan sesuai kebutuhan</li><li>Kelola keranjang & pesanan dalam satu tempat</li><li>Pantau status pembayaran secara langsung</li></ul>
      <div class="auth__orb" aria-hidden="true"></div>
    </aside>
    <div class="auth__main">
      <form class="auth__card chamfer" data-login-form novalidate>
        <h2>Login</h2>
        <p>Masuk untuk memilih dan memesan layanan.</p>
        <div class="form-grid">
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" /></div>
          <div class="field"><label for="password">Password</label>
            <div class="pw-toggle"><input id="password" name="password" type="password" required autocomplete="current-password" /><button type="button" data-pw-toggle>Lihat</button></div>
          </div>
          <div class="form-alert" data-alert role="alert"></div>
          <button class="btn btn-primary btn-block" type="submit">Login</button>
        </div>
        <p class="auth__switch">Belum punya akun? <a href="/register" data-register-link>Daftar sekarang</a></p>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
